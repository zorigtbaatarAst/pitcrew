name: ci

on:
  push:
    # The Rust port lives on a long-running branch for months, and the whole
    # point of its Windows job is that nobody here can compile that path
    # locally. A branch CI does not watch is a branch where that code rots.
    branches: [main, 'rust-**']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint
        run: make lint
      - name: test
        run: make test
      # The portable collector is what macOS runs every day and what a Linux
      # developer never runs by accident. Forcing it here means a regression in
      # it fails on the fast job, minutes before the macOS one gets there.
      - name: test again on the portable collector
        run: PITCREW_FORCE_COLLECTOR=ps make test
      # Same bargain for the menus. fzf is on every ubuntu runner and on no
      # stock Mac, so the numbered-prompt path is the one a new macOS user
      # meets first and the one nobody here would ever run by accident.
      - name: test again on the no-fzf picker
        run: PITCREW_PICKER=plain make test
      # Both config formats, because they are two front ends onto one model and
      # a regression in either is invisible from the other.
      - name: the tool runs at all
        run: |
          for fix in test/fixture test/fixture-yaml; do
            ./bin/pitcrew -C "$fix" help
            ./bin/pitcrew -C "$fix" status
            ./bin/pitcrew -C "$fix" doctor
            ./bin/pitcrew -C "$fix" status --json
            ./bin/pitcrew check "$fix"
            ./bin/pitcrew -C "$fix" diagnose --json
            ./bin/pitcrew -C "$fix" plugins
          done
          ./bin/pitcrew check examples/pitcrew.yaml

  # macOS is a supported target, not a courtesy: it is the only job that runs
  # the real ps/lsof/vm_stat/kern.boottime code against the real commands, and
  # the only one that would notice a GNU coreutils assumption creeping back in.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bash 5
        run: brew install bash          # macOS ships bash 3.2; pitcrew needs 5
      # $(brew --prefix) rather than a hard-coded /opt/homebrew: that path is
      # right on Apple silicon and wrong on the Intel runners (/usr/local).
      - name: put bash 5 first on PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: the bash we are testing with
        run: bash --version | head -1
      - name: lint
        run: make lint
      - name: test
        run: make test
      # Both config formats, because they are two front ends onto one model and
      # a regression in either is invisible from the other.
      - name: the tool runs at all
        run: |
          for fix in test/fixture test/fixture-yaml; do
            ./bin/pitcrew -C "$fix" help
            ./bin/pitcrew -C "$fix" status
            ./bin/pitcrew -C "$fix" doctor
            ./bin/pitcrew -C "$fix" status --json
            ./bin/pitcrew check "$fix"
            ./bin/pitcrew -C "$fix" diagnose --json
            ./bin/pitcrew -C "$fix" plugins
          done
          ./bin/pitcrew check examples/pitcrew.yaml

  # The GUI's tests skip themselves when the GTK bindings are absent, so without
  # this job those 22 tests never actually run anywhere. It also dogfoods
  # gui/install-deps.sh on two real OSes: if a package name in its tables is
  # wrong, this is what says so — which is the only way the macOS path gets
  # verified by anyone who does not own a Mac.
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install bash 5 (macOS ships 3.2)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: install the GUI dependencies, using our own installer
        run: make gui-deps YES=1
      # The python half had no static analysis until ruff's first run found
      # three undefined names, one of them a live NameError on a code path no
      # test could reach. `make lint` skips ruff when it is absent, so CI is
      # where it is actually enforced.
      - name: install ruff
        run: pipx install ruff || pip install --user ruff
      # A GTK widget with an icon name reaches for the icon theme, the icon
      # theme is per-display, and without one GTK aborts the process. Sixteen
      # tests skip themselves in that case — which is honest, and also means
      # they were never actually running here. Xvfb makes them run.
      - name: a display for the widget tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # --yes exits non-zero if anything is still missing, but say it loudly:
      # a silent "installed" that did not is the failure worth catching here.
      - name: and they really are importable now
        run: ./gui/install-deps.sh | tee /dev/stderr | grep -q 'Nothing to install'
      - name: lint (shellcheck + ruff)
        run: make lint
      - name: gui tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a make test T=gui
          else make test T=gui; fi
      - name: the launcher finds an interpreter and runs
        run: ./gui/pitcrew-gui --help
      # A fresh clone, start to finish, on both OSes.
      - name: setup.sh takes a clean checkout to ready
        run: ./setup.sh --yes

  # Windows, for real. Everything the tool does there — the wmic/netstat
  # collectors, the shim install.sh writes, the bash-5 guard — had been written
  # and never run. Git for Windows ships bash 5.2, so `shell: bash` on this
  # runner IS what a user has.
  #
  # continue-on-error until it has been green once, then delete that line. A
  # job that reports is worth more than no job; one that blocks main before
  # anybody has watched it run is not.
  #
  # The scripts are called directly rather than through `make`: GNU make is not
  # something a Windows user is assumed to have, and neither is this job.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: the bash we are testing with
        run: bash --version | head -1; uname -s
      - name: lint
        run: bash test/lint.sh
      - name: test
        run: bash test/run.sh
      - name: the tool runs at all
        run: |
          for fix in test/fixture test/fixture-yaml; do
            ./bin/pitcrew -C "$fix" help
            ./bin/pitcrew -C "$fix" status
            ./bin/pitcrew -C "$fix" doctor
            ./bin/pitcrew -C "$fix" status --json
            ./bin/pitcrew check "$fix"
            ./bin/pitcrew -C "$fix" diagnose --json
          done
      # --no-gui: Git Bash has no GTK stack and never will. The desktop app on
      # Windows is MSYS2's job, which is the next block.
      - name: setup.sh takes a clean checkout to ready
        run: ./setup.sh --yes --no-gui
      - name: and the command it installed actually runs
        run: '"$HOME/.local/bin/pitcrew" --version'

  # The desktop app on Windows, end to end, on a real MSYS2: install the GTK
  # stack with our own installer, run our own setup, and then check that the
  # thing a user double-clicks is actually on disk. Every bug this was written
  # to fix was invisible to reading and would have been caught here in one run.
  windows-gui:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Deliberately NOT the GTK stack: gui/install-deps.sh is what has to
          # install that, and a job that pre-installed it would only prove the
          # runner works.
          install: git
      - name: what our installer thinks this box needs
        run: ./gui/install-deps.sh --dry-run
      - name: let it install it
        run: ./gui/install-deps.sh --yes
      # --yes exits non-zero if anything is still missing, but say it loudly: a
      # silent "installed" that did not is the failure worth catching here, and
      # on Windows it is the failure that actually happened.
      # No `tee /dev/stderr` here: MSYS2 has no /dev/stderr node, so the step
      # failed on the plumbing rather than on the thing it was checking.
      - name: and they really are importable now
        run: |
          report=$(./gui/install-deps.sh)
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -q 'Nothing to install'
      - name: the whole setup, desktop app included
        run: ./setup.sh --yes
      - name: the launcher finds an interpreter and runs
        run: ./gui/pitcrew-gui --help
      # The point of the whole job. A Start Menu entry and a Desktop icon are
      # what "installed" means here, and both used to be silently skipped.
      - name: the shortcuts a user clicks really exist
        run: |
          for folder in Programs Desktop; do
            dir=$(powershell.exe -NoProfile -NonInteractive -Command \
              "(New-Object -ComObject WScript.Shell).SpecialFolders('$folder')" | tr -d '\r')
            lnk="$(cygpath -u "$dir")/pitcrew.lnk"
            if [ -f "$lnk" ]; then echo "ok       $lnk"
            else echo "MISSING  $lnk" >&2; exit 1; fi
          done
      - name: gui tests
        run: bash test/run.sh gui

  # The Rust port, alongside the bash tree rather than instead of it: both
  # implementations coexist until the port reaches parity, and this job is what
  # says the contract types still match what bash actually emits.
  #
  # The parity gate (crates/pitcrew-model/tests/contract.rs) round-trips real
  # captured `status --json` output through the Rust types. A field bash adds
  # and Rust does not model fails here, naming the JSON path — which is the
  # whole point of porting the contract before porting anything that produces it.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      # -D warnings, because a lint that is only ever a notice is a lint nobody
      # reads — the same bargain shellcheck --severity=warning already makes here.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  # The Rust desktop app, which needs GTK4 and libadwaita DEVELOPMENT headers —
  # a different install from the runtime libraries the Python app needs, and
  # separately missable. Its own job because those headers are not worth putting
  # on every runner for the CLI's sake.
  rust-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.os }}
      - name: gtk4 development headers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
          else
            brew install gtk4 libadwaita
          fi
        shell: bash
      - name: clippy
        run: cargo clippy -p pitcrew-gui --all-targets -- -D warnings
      - name: test
        run: cargo test -p pitcrew-gui

  # There is no third Windows job, and the two above do not cover integration:
  # a real stack of real services running on a real box is still untested.
  #
  # The bash-3.2 guard is a feature: it has to say what is wrong and how to fix
  # it, not die with a syntax error out of a random lib file. /bin/bash on a
  # macOS runner IS 3.2, so this is the real thing rather than a simulation.
  macos-old-bash:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 3.2 gets a usable message, not a syntax error
        run: |
          /bin/bash --version | head -1
          out=$(/bin/bash ./bin/pitcrew help 2>&1) && { echo "expected a non-zero exit"; exit 1; }
          echo "$out"
          case "$out" in
            *"needs bash 5"*"brew install bash"*) echo "ok" ;;
            *) echo "unhelpful message on bash 3.2"; exit 1 ;;
          esac
