name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint
        run: make lint
      - name: test
        run: make test
      # The portable collector is what macOS runs every day and what a Linux
      # developer never runs by accident. Forcing it here means a regression in
      # it fails on the fast job, minutes before the macOS one gets there.
      - name: test again on the portable collector
        run: PITCREW_FORCE_COLLECTOR=ps make test
      # Same bargain for the menus. fzf is on every ubuntu runner and on no
      # stock Mac, so the numbered-prompt path is the one a new macOS user
      # meets first and the one nobody here would ever run by accident.
      - name: test again on the no-fzf picker
        run: PITCREW_PICKER=plain make test
      # Both config formats, because they are two front ends onto one model and
      # a regression in either is invisible from the other.
      - name: the tool runs at all
        run: |
          for fix in test/fixture test/fixture-yaml; do
            ./bin/pitcrew -C "$fix" help
            ./bin/pitcrew -C "$fix" status
            ./bin/pitcrew -C "$fix" doctor
            ./bin/pitcrew -C "$fix" status --json
            ./bin/pitcrew check "$fix"
            ./bin/pitcrew -C "$fix" diagnose --json
            ./bin/pitcrew -C "$fix" plugins
          done
          ./bin/pitcrew check examples/pitcrew.yaml

  # macOS is a supported target, not a courtesy: it is the only job that runs
  # the real ps/lsof/vm_stat/kern.boottime code against the real commands, and
  # the only one that would notice a GNU coreutils assumption creeping back in.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bash 5
        run: brew install bash          # macOS ships bash 3.2; pitcrew needs 5
      # $(brew --prefix) rather than a hard-coded /opt/homebrew: that path is
      # right on Apple silicon and wrong on the Intel runners (/usr/local).
      - name: put bash 5 first on PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: the bash we are testing with
        run: bash --version | head -1
      - name: lint
        run: make lint
      - name: test
        run: make test
      # Both config formats, because they are two front ends onto one model and
      # a regression in either is invisible from the other.
      - name: the tool runs at all
        run: |
          for fix in test/fixture test/fixture-yaml; do
            ./bin/pitcrew -C "$fix" help
            ./bin/pitcrew -C "$fix" status
            ./bin/pitcrew -C "$fix" doctor
            ./bin/pitcrew -C "$fix" status --json
            ./bin/pitcrew check "$fix"
            ./bin/pitcrew -C "$fix" diagnose --json
            ./bin/pitcrew -C "$fix" plugins
          done
          ./bin/pitcrew check examples/pitcrew.yaml

  # The GUI's tests skip themselves when the GTK bindings are absent, so without
  # this job those 22 tests never actually run anywhere. It also dogfoods
  # gui/install-deps.sh on two real OSes: if a package name in its tables is
  # wrong, this is what says so — which is the only way the macOS path gets
  # verified by anyone who does not own a Mac.
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install bash 5 (macOS ships 3.2)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: install the GUI dependencies, using our own installer
        run: make gui-deps YES=1
      # The python half had no static analysis until ruff's first run found
      # three undefined names, one of them a live NameError on a code path no
      # test could reach. `make lint` skips ruff when it is absent, so CI is
      # where it is actually enforced.
      - name: install ruff
        run: pipx install ruff || pip install --user ruff
      # A GTK widget with an icon name reaches for the icon theme, the icon
      # theme is per-display, and without one GTK aborts the process. Sixteen
      # tests skip themselves in that case — which is honest, and also means
      # they were never actually running here. Xvfb makes them run.
      - name: a display for the widget tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # --yes exits non-zero if anything is still missing, but say it loudly:
      # a silent "installed" that did not is the failure worth catching here.
      - name: and they really are importable now
        run: ./gui/install-deps.sh | tee /dev/stderr | grep -q 'Nothing to install'
      - name: lint (shellcheck + ruff)
        run: make lint
      - name: gui tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a make test T=gui
          else make test T=gui; fi
      - name: the launcher finds an interpreter and runs
        run: ./gui/pitcrew-gui --help
      # A fresh clone, start to finish, on both OSes.
      - name: setup.sh takes a clean checkout to ready
        run: ./setup.sh --yes

  # There is no Windows runner here, and adding one would not help much: the
  # value is in the PARSERS, and those are pure filters over captured output
  # that the Linux job already runs. What a Windows job would catch is the
  # integration, which needs a real stack running on a real box.
  #
  # The bash-3.2 guard is a feature: it has to say what is wrong and how to fix
  # it, not die with a syntax error out of a random lib file. /bin/bash on a
  # macOS runner IS 3.2, so this is the real thing rather than a simulation.
  macos-old-bash:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 3.2 gets a usable message, not a syntax error
        run: |
          /bin/bash --version | head -1
          out=$(/bin/bash ./bin/pitcrew help 2>&1) && { echo "expected a non-zero exit"; exit 1; }
          echo "$out"
          case "$out" in
            *"needs bash 5"*"brew install bash"*) echo "ok" ;;
            *) echo "unhelpful message on bash 3.2"; exit 1 ;;
          esac
