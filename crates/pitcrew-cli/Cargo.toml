[package]
name = "pitcrew-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A config-driven local dev-stack launcher for multi-service monorepos."

[[bin]]
name = "pitcrew"
path = "src/main.rs"

[dependencies]
pitcrew-model = { workspace = true }
pitcrew-core = { workspace = true }
pitcrew-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
