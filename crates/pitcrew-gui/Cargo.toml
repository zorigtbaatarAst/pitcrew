[package]
name = "pitcrew-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The pitcrew desktop app."

[[bin]]
name = "pitcrew-gui"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_10"] }
pitcrew-core.workspace = true
pitcrew-model = { workspace = true }
serde_json = { workspace = true }
