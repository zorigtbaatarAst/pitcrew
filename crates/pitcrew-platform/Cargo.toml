[package]
name = "pitcrew-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The only crate that knows which OS it is running on."

[dependencies]
netstat2 = "0.11.2"
sysinfo = "0.39"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_SystemServices"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
